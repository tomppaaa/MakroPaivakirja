<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Meal</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1><a href="/">Meal Tracker</a></h1>
    </header>

    <main>
        <section class="meal-card">
            <h2>Add a new meal</h2>

            <form action="/add_meal" method="POST">
                <p>
                    <label for="name">Meal name:</label><br>
                    <input type="text" id="name" name="name" required>
                </p>

                <p>
                    <label for="meal_type">Meal type:</label><br>
                    <select id="meal_type" name="meal_type" required>
                        <option value="Breakfast">Breakfast</option>
                        <option value="Lunch">Lunch</option>
                        <option value="Dinner">Dinner</option>
                        <option value="Snack">Snack</option>
                        <option value="Evening meal">Evening meal</option>
                    </select>
                </p>

                <p>
                    <label for="calories">Calories (kcal):</label><br>
                    <input type="number" id="calories" name="calories" min="0" value="0">
                </p>

                <p>
                    <label for="protein">Protein (g):</label><br>
                    <input type="number" id="protein" name="protein" min="0" value="0">
                </p>

                <p>
                    <label for="carbs">Carbohydrates (g):</label><br>
                    <input type="number" id="carbs" name="carbs" min="0" value="0">
                </p>

                <p>
                    <label for="fat">Fat (g):</label><br>
                    <input type="number" id="fat" name="fat" min="0" value="0">
                </p>

                <p>
                    <label for="price">Price (€):</label><br>
                    <input type="number" id="price" name="price" min="0" step="0.01" value="0">
                </p>

                <p>
                    <strong>Diet categories:</strong><br>
                    {% for diet in diets %}
                        <label>
                            <input type="checkbox" name="diets" value="{{ diet.id }}">
                            {{ diet.name }}
                        </label><br>
                    {% endfor %}
                </p>

                <button type="submit">Save meal</button>
            </form>
        </section>
    </main>
</body>
</html>
