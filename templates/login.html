<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign In</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1><a href="/">Meal Tracker</a></h1>
  </header>

  <main>
    <section class="meal-card">
      <h2>Sign in</h2>
      {% if errors %}
        <div class="form-error">
          <ul>
            {% for error in errors %}
              <li>{{ error }}</li>
            {% endfor %}
          </ul>
        </div>
      {% endif %}
      <form action="/login" method="post">
        <p>
          Username: <br />
          <input type="text" name="username" value="{{ username or '' }}" />
        </p>
        <p>
          Password: <br />
          <input type="password" name="password" />
        </p>
        <button type="submit">Sign in</button>
      </form>
    </section>
  </main>
</body>
</html>
